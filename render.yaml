services:
  - type: web
    name: stock-control
    runtime: node
    plan: free
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build && npm --prefix backend ci
    startCommand: npm --prefix backend start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: STOCK_DB_PATH
        value: /opt/render/project/src/backend/data/stock.sqlite
      - key: STOCK_UPLOADS_DIR
        value: /opt/render/project/src/backend/data/uploads
